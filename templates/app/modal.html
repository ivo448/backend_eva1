{% load static %}
<script src="{% static 'js/jquery.bootstrap.modal.forms.js' %}"></script>
<script>
$(document).ready(function() {
    $(".delete-{{ tipo_delete }}").each(function () {
        $(this).modalForm({
            formURL: $(this).data('form-url'),
            modalID: "#modal"
        });
    });
});
</script>
